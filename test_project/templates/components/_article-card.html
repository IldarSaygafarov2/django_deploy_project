<div class="card">
    {% if article.photo %}
    <img src="{{article.photo.url}}" class="card-img-top" alt="...">
    {% endif %}
    <div class="card-body">
        <h4 class="card-title">{{article.title}}</h4>
        <p class="card-text">{{ article.description|slice:"10"}}</p>
    </div>
    <ul class="list-group list-group-flush">
        <li class="list-group-item">
            <b>Категория: </b>{{article.category}}
        </li>
        <li class="list-group-item">
            <b>Пользователь: </b>{{article.user}}
        </li>
        <li class="list-group-item">
            <b>Опубликовано в: </b>{{article.created_at}}
        </li>
    </ul>
    <div class="card-body flex-row gap-4">
        <a href="{% url 'detail-page' article.slug %}">Подробнее</a>
    </div>
</div>
