# Backend Gunicorn через Unix Socket
upstream django {
    # Адрес сокета Gunicorn
    server unix:/run/gunicorn/gunicorn.sock;
}

# Сервер для обработки HTTP
server {
    # Порт, который слушает Nginx
    listen 80;

    # Домен сайта
    server_name example.com www.example.com;

    # Максимальный размер запроса
    client_max_body_size 100M;

    # Лог запросов сайта
    access_log /var/log/nginx/project_access.log;

    # Лог ошибок сайта
    error_log /var/log/nginx/project_error.log;

    # Обработка статических файлов Django
    location /static/ {

        # Путь к собранной статике
        alias /home/user/project/staticfiles/;

        # Кэширование в браузере
        expires 30d;

        # Не писать запросы статики в лог
        access_log off;
    }

    # Обработка пользовательских файлов
    location /media/ {

        # Путь к MEDIA_ROOT Django
        alias /home/user/project/media/;

        # Кэширование файлов
        expires 30d;

        # Отключение логирования
        access_log off;
    }

    # Все остальные запросы идут в Django
    location / {

        # Передача запроса Gunicorn
        proxy_pass http://django;

        # Использовать HTTP/1.1 между Nginx и Gunicorn
        proxy_http_version 1.1;

        # Передать оригинальный Host
        proxy_set_header Host $host;

        # Передать IP пользователя
        proxy_set_header X-Real-IP $remote_addr;

        # Передать цепочку IP адресов
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Передать протокол (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключить автоматическое изменение URL
        proxy_redirect off;

        # Таймаут подключения к Gunicorn
        proxy_connect_timeout 60;

        # Таймаут отправки данных
        proxy_send_timeout 60;

        # Таймаут ожидания ответа Django
        proxy_read_timeout 60;
    }
}